global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "nestjs-api"
    static_configs:
      - targets: ["localhost:3001"]
    metrics_path: "/metrics"

  - job_name: "fastapi-ml"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: "/metrics"
