# NOTE: In a real environment, use SealedSecrets or an external secret manager like HashiCorp Vault / AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  # Base64 encoded values should be provided dynamically or via sealed secrets.
  # This serves as a placeholder structure.
  DATABASE_URL: {{ printf "postgresql://postgres:postgres@%s:%v/%s" .Values.postgres.host .Values.postgres.port .Values.postgres.database | b64enc | quote }}
  JWT_SECRET: {{ "super_secret_jwt_key_placeholder" | b64enc | quote }}
