apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-api-svc
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: {{ .Chart.Name }}-api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-web-svc
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: {{ .Chart.Name }}-web
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-ml-svc
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: {{ .Chart.Name }}-ml
