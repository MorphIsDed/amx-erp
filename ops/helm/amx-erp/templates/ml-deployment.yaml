apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-ml
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}-ml
spec:
  replicas: {{ .Values.replicaCount.ml }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-ml
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-ml
    spec:
      containers:
        - name: ml
          image: "{{ .Values.image.repository }}-ml:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.ml | nindent 12 }}
