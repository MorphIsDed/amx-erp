name: AMX-ERP Suite CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amx_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Python 3.11 for ML
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Checks
        run: pnpm lint

      - name: Verify TypeScript compilation
        run: pnpm check-types

      - name: Generate Prisma Database Schema
        run: pnpm --filter @repo/db postinstall

      - name: Run Backend Unit Tests
        run: pnpm --filter api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amx_erp_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Build Production Workspace Bundle
        run: pnpm build

      - name: Lint ML microservice (Python)
        working-directory: apps/ml-service
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  security-scan:
    needs: audit-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Snyk to check for vulnerabilities
        continue-on-error: true
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects

      - name: Build local image for Trivy scan
        run: docker build -t amx-erp:local -f apps/api/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'amx-erp:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/amx-erp-api:latest,${{ secrets.DOCKER_USERNAME }}/amx-erp-api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ArgoCD Sync
        run: |
          echo "Triggering ArgoCD Webhook to sync new image..."
          curl -X POST -H "Content-Type: application/json" \
               -d '{"ref":"main"}' \
               ${{ secrets.ARGOCD_WEBHOOK_URL }} || echo "ArgoCD triggered."

      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "AMX-ERP Production Deployment"
          SLACK_MESSAGE: "Status: ${{ job.status }}\nCommit: ${{ github.sha }}"
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
