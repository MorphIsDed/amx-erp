name: AMX-ERP Suite CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amx_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Python 3.11 for ML
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Checks
        run: pnpm lint

      - name: Verify TypeScript compilation
        run: pnpm check-types

      - name: Generate Prisma Database Schema
        run: pnpm --filter @repo/db postinstall

      - name: Run Backend Unit Tests
        run: pnpm --filter api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amx_erp_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Build Production Workspace Bundle
        run: pnpm build

      - name: Lint ML microservice (Python)
        working-directory: apps/ml-service
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
